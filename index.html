<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>StudyPlan</title>
<style>
  :root{
    --bg:#F4F7FC; --surface:#FFFFFF; --surfaceAlt:#EEF3FC;
    --primary:#3358E0; --primary2:#6C8CF5; --primarySoft:#E4EBFC;
    --accent:#FF8A5B; --gold:#E8B23D;
    --text:#1B2130; --textSub:#6B7280; --border:#E7EBF3;
    --success:#37A876; --danger:#E0605F;
    --shadow:0 2px 10px rgba(30,45,90,.06); --shadowLg:0 10px 30px rgba(30,45,90,.14);
  }
  body.dark{
    --bg:#10131B; --surface:#1B1F2A; --surfaceAlt:#232A3A;
    --primary:#89A6FF; --primary2:#6C8CF5; --primarySoft:#232B44;
    --accent:#FF9E76; --gold:#F0C866;
    --text:#EDEFF5; --textSub:#98A0B3; --border:#2A3040;
    --success:#5FC493; --danger:#E88080;
    --shadow:0 2px 10px rgba(0,0,0,.25); --shadowLg:0 14px 34px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
    background:var(--bg); color:var(--text); transition:background .25s,color .25s;
  }
  #app{ width:100%; max-width:1200px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }
  #header{ padding:18px 20px 16px; background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff; border-radius:0 0 22px 22px; position:relative; overflow:hidden; box-shadow:var(--shadow); }
  #header::before{ content:""; position:absolute; top:-40px; right:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.10); }
  #header::after{ content:""; position:absolute; bottom:-50px; left:-20px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.07); }
  #headerTop{ display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; }
  #headerDate{ font-size:12.5px; opacity:.85; letter-spacing:.3px; }
  #headerGreet{ font-size:19px; font-weight:800; margin-top:2px; letter-spacing:.2px; }
  .iconbtn{ border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.16); color:#fff; border-radius:999px; width:34px; height:34px; cursor:pointer; font-size:14px; }
  #headerBanner{ margin-top:13px; background:rgba(255,255,255,.20); border-radius:12px; padding:9px 13px; font-size:12.5px; font-weight:700; position:relative; z-index:1; display:flex; align-items:center; gap:8px; }
  #saveIndicator{ font-size:10px; opacity:.8; margin-left:auto; font-weight:500; white-space:nowrap; }
  #content{ flex:1; overflow-y:auto; padding-bottom:88px; -webkit-overflow-scrolling:touch; }
  #content.content-flex{ display:flex; flex-direction:column; overflow:hidden; min-height:0; }
  #bottomnav{ position:fixed; bottom:0; left:0; right:0; width:100%; display:flex; justify-content:space-around; background:var(--surface); border-top:1px solid var(--border); padding:8px 4px 12px; box-shadow:0 -4px 16px rgba(20,30,60,.05); }
  .navbtn{ border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--textSub); cursor:pointer; font-size:9.5px; font-weight:500; width:54px; padding:5px 0; border-radius:12px; transition:background .15s,color .15s; }
  .navbtn.active{ color:var(--primary); font-weight:700; background:var(--primarySoft); }
  .navicon{ font-size:16px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow); }
  .sectiontitle{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:800; color:var(--textSub); letter-spacing:.3px; }
  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; font-size:11.5px; padding:7px 11px; cursor:pointer; transition:transform .1s,background .15s; }
  .btn:active{ transform:scale(.96); }
  .btn.primary{ background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff; border:none; font-weight:700; box-shadow:0 4px 12px rgba(51,88,224,.28); }
  .btn.soft{ background:var(--primarySoft); color:var(--primary); border:none; font-weight:700; }
  .statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .statcard{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px; box-shadow:var(--shadow); }
  .statlabel{ font-size:11.5px; color:var(--textSub); margin-top:5px; font-weight:600; }
  .statvalue{ font-size:15px; font-weight:800; margin-top:2px; }
  .badgegrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .badgecard{ border-radius:16px; padding:13px; border:1px solid var(--border); background:var(--surfaceAlt); opacity:.55; transition:opacity .2s,transform .2s; }
  .badgecard.on{ background:linear-gradient(135deg,var(--primarySoft),var(--surface)); border-color:var(--gold); opacity:1; box-shadow:var(--shadow); }
  .badgetitle{ font-size:12.5px; font-weight:800; margin-top:6px; }
  .badgecond{ font-size:10.5px; color:var(--textSub); margin-top:2px; }
  .expbar{ background:var(--border); border-radius:999px; height:9px; overflow:hidden; }
  .expbarfill{ height:100%; background:linear-gradient(90deg,var(--primary),var(--gold)); border-radius:999px; transition:width .4s ease; }
  input,textarea,select{ font-family:inherit; }
  .field-input{ width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:11px; padding:10px 12px; font-size:13.5px; margin-bottom:4px; }
  .field-label{ font-size:11.5px; font-weight:800; color:var(--textSub); margin-bottom:6px; margin-top:10px; letter-spacing:.2px; }
  .overlay{ position:fixed; inset:0; background:rgba(15,20,35,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; animation:fadein .15s ease; }
  @keyframes fadein{ from{opacity:0;} to{opacity:1;} }
  .sheet{ background:var(--surface); border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:520px; max-height:82vh; overflow-y:auto; animation:slideup .2s ease; box-shadow:var(--shadowLg); }
  @keyframes slideup{ from{transform:translateY(20px); opacity:.6;} to{transform:translateY(0); opacity:1;} }
  .toggle{ width:42px; height:24px; border-radius:999px; position:relative; cursor:pointer; transition:background .15s; }
  .toggle-knob{ width:18px; height:18px; border-radius:999px; background:#fff; position:absolute; top:3px; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .chip{ padding:8px 15px; border-radius:999px; color:#fff; font-size:12.5px; font-weight:700; cursor:grab; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .timeline{ position:relative; height:430px; overflow-y:auto; border:1px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:var(--shadow); }
  .hourrow{ position:absolute; left:0; right:0; height:52px; border-top:1px solid var(--border); font-size:10px; color:var(--textSub); padding:2px 6px; font-weight:600; }
  .block{ position:absolute; left:50px; right:8px; border-radius:10px; padding:5px 9px; cursor:grab; box-shadow:0 2px 6px rgba(20,30,60,.08); transition:box-shadow .15s; }
  .nowline{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--danger); z-index:5; pointer-events:none; }
  .nowline-label{ position:absolute; left:4px; top:0; transform:translateY(-50%); background:var(--danger); color:#fff; font-size:10px; font-weight:800; line-height:1; padding:3px 6px; border-radius:999px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .nowline-dot{ position:absolute; left:50px; top:0; width:8px; height:8px; border-radius:50%; background:var(--danger); transform:translate(-50%,-50%); }
  .resizehandle{ position:absolute; left:0; right:0; bottom:0; height:12px; cursor:ns-resize; display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px; }
  .resizegrip{ width:26px; height:3px; border-radius:3px; background:rgba(0,0,0,.18); }
  .chatbubble{ max-width:82%; border-radius:16px; padding:10px 14px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; }
  .msg-user{ align-self:flex-end; background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff; }
  .msg-ai{ align-self:flex-start; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); }
  a{ cursor:pointer; }
  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:100; background:var(--surface); border:1px solid var(--gold); box-shadow:var(--shadowLg); border-radius:16px; padding:14px 22px; text-align:center; animation:toastin .3s ease; max-width:340px; }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,-12px);} to{opacity:1; transform:translate(-50%,0);} }
  .fadein{ animation:fadein .18s ease; }
  .itemcell{ border-radius:14px; padding:10px; text-align:center; border:1px solid var(--border); background:var(--surfaceAlt); cursor:pointer; opacity:.45; }
  .itemcell.unlocked{ opacity:1; }
  .itemcell.equipped{ border-color:var(--primary); background:var(--primarySoft); box-shadow:0 0 0 2px var(--primary) inset; }
  .chip, .block, .resizehandle{ touch-action:none; }
  .qreply{ border:1px solid var(--primary); background:var(--primarySoft); color:var(--primary); border-radius:999px; font-size:12px; font-weight:700; padding:7px 14px; cursor:pointer; }
  .qreply:active{ transform:scale(.96); }
  .timerring{ display:flex; align-items:center; justify-content:center; }
  .startbtn{ border:none; background:var(--success); color:#fff; font-weight:800; border-radius:999px; padding:6px 12px; font-size:11px; cursor:pointer; white-space:nowrap; }
  .plantable{ width:100%; border-collapse:collapse; font-size:12px; }
  .plantd{ padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .plantable thead .plantd{ font-size:10.5px; color:var(--textSub); font-weight:800; border-bottom:2px solid var(--border); }

  /* ===== Responsive layout (③) ===== */
  .home-wrap{ padding:18px; display:flex; flex-direction:column; gap:12px; margin-top:-8px; }
  .home-main, .home-side{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .sched-wrap{ padding:14px 16px 0; padding-bottom:80px; }
  .sched-side, .sched-main{ min-width:0; }
  .todo-list{ display:flex; flex-direction:column; gap:8px; }
  .avatar-wrap{ padding:18px; display:flex; flex-direction:column; gap:16px; }
  .fab-wrap{ position:fixed; left:0; right:0; bottom:96px; pointer-events:none; }
  .fab-inner{ max-width:1200px; margin:0 auto; display:flex; justify-content:flex-end; padding-right:22px; }
  #bottomnav{ justify-content:space-around; }
  @media (min-width:600px){
    #bottomnav{ justify-content:center; gap:10px; }
    .navbtn{ width:72px; }
    .sheet{ max-width:560px; }
  }
  @media (min-width:768px){
    #header{ padding-left:32px; padding-right:32px; }
    #content{ padding-left:8px; padding-right:8px; }
    .overlay{ align-items:center; }
    .sheet{ border-radius:20px; }
    .statgrid{ grid-template-columns:repeat(4,1fr); }
    .badgegrid{ grid-template-columns:repeat(4,1fr); }
    .ai-wrap{ width:100%; max-width:860px; margin:0 auto; }
    .todo-list{ display:grid; grid-template-columns:repeat(2,1fr); }
    .journal-wrap{ max-width:860px; margin:0 auto; }
    .fab-inner{ padding-right:32px; }
  }
  @media (min-width:960px){
    .home-wrap{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px; align-items:start; padding:22px 24px; }
    .sched-wrap{ display:grid; grid-template-columns:minmax(300px,360px) minmax(0,1fr); gap:20px; align-items:start; padding:18px 24px 0; padding-bottom:90px; }
    .sched-wrap .timeline{ height:clamp(430px, calc(100vh - 260px), 820px); }
    .statgrid{ grid-template-columns:1fr 1fr; }
    .badgegrid{ grid-template-columns:repeat(4,1fr); }
    .avatar-wrap{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:16px; align-items:start; }
    .avatar-wrap > .avatar-full{ grid-column:1 / -1; }
    .todo-list{ grid-template-columns:repeat(3,1fr); }
    .fab-inner{ padding-right:40px; }
  }

  /* ===== ⑤ 完了演出 ===== */
  .celebrate-root{ position:fixed; inset:0; z-index:120; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; pointer-events:none; transition:opacity .3s; }
  .celebrate-root.levelup{ align-items:center; padding-top:0; background:rgba(15,20,35,.5); pointer-events:auto; }
  .celebrate-root.leaving{ opacity:0; }
  .celebrate-card{ pointer-events:auto; position:relative; width:min(86vw,320px); background:var(--surface); border:1px solid var(--gold); border-radius:22px; box-shadow:var(--shadowLg); padding:18px 20px; text-align:center; animation:celpop .38s cubic-bezier(.2,1.4,.4,1); }
  .levelup .celebrate-card{ width:min(88vw,340px); padding:22px 20px 20px; border:2px solid var(--gold); background:linear-gradient(160deg,var(--surface),var(--primarySoft)); }
  .cel-title{ font-size:14px; font-weight:800; color:var(--textSub); }
  .cel-exp{ font-size:34px; font-weight:900; color:var(--primary); line-height:1.2; margin-top:4px; animation:celexp .55s .12s cubic-bezier(.2,1.6,.4,1) both; }
  .cel-lv{ font-size:14px; font-weight:800; margin-top:2px; }
  .cel-next{ font-size:11.5px; color:var(--textSub); margin-top:6px; }
  .cel-extra{ font-size:12px; font-weight:700; margin-top:8px; color:var(--text); }
  .cel-lvup-title{ font-size:28px; font-weight:900; letter-spacing:1px; background:linear-gradient(90deg,var(--primary),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:celexp .6s cubic-bezier(.2,1.6,.4,1) both; }
  .cel-avatar{ position:relative; width:96px; height:96px; margin:8px auto 4px; }
  .cel-avatar > div{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .cel-avatar .old{ animation:celold .5s 1s ease forwards; }
  .cel-avatar .new{ opacity:0; animation:celnew .7s 1s cubic-bezier(.2,1.5,.4,1) forwards; }
  .cel-spark{ position:absolute; font-size:16px; opacity:0; animation:celspark 1.6s ease-out forwards; pointer-events:none; }
  @keyframes celpop{ from{ transform:scale(.8) translateY(10px); opacity:0; } to{ transform:scale(1) translateY(0); opacity:1; } }
  @keyframes celexp{ from{ transform:scale(.5); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes celold{ to{ opacity:0; transform:scale(.85); } }
  @keyframes celnew{ 0%{ opacity:0; transform:scale(.6); filter:brightness(2); } 100%{ opacity:1; transform:scale(1); filter:none; } }
  @keyframes celspark{ 0%{ opacity:0; transform:translate(0,0) scale(.4); } 30%{ opacity:1; } 100%{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.1); } }
  @media (prefers-reduced-motion: reduce){
    .celebrate-card, .cel-exp, .cel-lvup-title, .cel-avatar .old, .cel-avatar .new, .cel-spark{ animation:none; }
    .cel-avatar .old{ opacity:0; } .cel-avatar .new{ opacity:1; }
  }
</style>
</head>
<body>

  <div id="header">
    <div id="headerTop">
      <div>
        <div id="headerDate"></div>
        <div id="headerGreet"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="iconbtn" data-action="toggle-dark">☀️</button>

const SHARE_FIELD_DEFS = [
  {id:'aiReport', label:'AI学習レポート', defaultOn:true},
  {id:'hitokoto', label:'今日の一言', defaultOn:true},

  return ITEMS.filter(it=> it.unlockBadge===null || earned.has(it.unlockBadge));
}
function earnedBadgesRaw(){
  // avoid circular dep: compute badges using totalMinutes/level/streak/completedCount only (not itemCount)
  const s = {level:level(), streak:state.streak, totalMinutes:state.totalMinutes, completedCount:completedCount(), unlockedItemCount:99};
  return BADGES.filter(b=> b.id==='b8' ? false : b.check(s));
}
function earnedBadges(){
  const unlockedCount = unlockedItems().length;
  const s = {level:level(), streak:state.streak, totalMinutes:state.totalMinutes, completedCount:completedCount(), unlockedItemCount:unlockedCount};
  return BADGES.filter(b=>b.check(s));
}

// ==================== persistence ====================
// Prefer the Claude artifact storage API when this page is previewed inside Claude.
// When the file is downloaded and opened directly in a normal browser, that API
// doesn't exist, so we fall back to localStorage — which persists fine across
// reloads of the same file in that case.
const storageBackend = {
  async get(key){
    if(typeof window.storage !== "undefined" && window.storage && window.storage.get){
      try{ return await window.storage.get(key, false); }catch(e){ /* fall through to localStorage */ }
    }
    try{
      const v = localStorage.getItem(key);
      return v ? { value:v } : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if(typeof window.storage !== "undefined" && window.storage && window.storage.set){
      try{ return await window.storage.set(key, value, false); }catch(e){ /* fall through to localStorage */ }
    }
    try{
      localStorage.setItem(key, value);
      return { value };
    }catch(e){ return null; }
  }
};

// 旧バージョンの初期サンプルだけを一度だけ除去（内容が完全一致し未完了のものに限る。判別できないデータは残す）
function migrateSampleFriends(){
  try{
    if(Array.isArray(state.friendPosts) && !myUserId)
      state.friendPosts = state.friendPosts.filter(x=>!((x.name==="みお"&&x.level===14&&x.streak===9)||(x.name==="ゆい"&&x.level===21)) || x.userId || x.user_id);
    const sampleNames = {"みお":"英語がんばってる！","はると":"数学むずい〜","ゆい":"模試まであと少し"};
    if(Array.isArray(state.friends) && !myUserId)
      state.friends = state.friends.filter(f=>!(sampleNames[f.name]===f.comment && !f.userId && !f.user_id));
  }catch(e){ console.error("friend migration skipped", e); }
}
function migrateSampleData(){
  migrateSampleFriends();
  if(state.sampleMigratedV2) return;
  try{
    const sampleTask = t => !t.done && ((t.title==="理科の勉強" && t.deadline==="7/16" && t.importance==="high") || (t.title==="数学" && t.deadline==="7/16" && t.importance==="med"));
    const sampleBlock = b => !b.done && !b.memo && ((b.title==="数学" && b.subject==="数学" && b.start===18 && b.duration===1) || (b.title==="理科" && b.subject==="理科" && b.start===20 && b.duration===2));
    if(Array.isArray(state.tasks)) state.tasks = state.tasks.filter(t=>!sampleTask(t));
    if(Array.isArray(state.blocks)) state.blocks = state.blocks.filter(b=>!sampleBlock(b));
    if(state.exp===45 && state.streak===7 && !state.totalMinutes){ state.exp = 0; state.streak = 0; }
    state.sampleMigratedV2 = true;
  }catch(e){ console.error("sample migration skipped", e); }
}

async function initSupabaseSync(){

      if(error){ console.error("anonymous sign-in failed", error); authErrorMsg = error.message || String(error); return; }

async function searchProfiles(query){
  state.friendSearchError = "";
  if(!sb){ state.friendSearchError = "オンライン機能が使えない状態だよ"; return []; }
  if(!myUserId){
    // 初期ログインが終わっていない/失敗していた場合にもう一度セッションを取りにいく
    try{
      let { data:{ session } } = await sb.auth.getSession();
      if(!session){
        const r = await sb.auth.signInAnonymously();
        if(r.error) authErrorMsg = r.error.message || String(r.error);
        session = r.data && r.data.session;
      }
      if(session) myUserId = session.user.id;
    }catch(err){ console.error("session retry failed", err); authErrorMsg = (err && err.message) || String(err); }
  }
  if(!myUserId){ state.friendSearchError = "ログインできてないみたい（原因: " + (authErrorMsg || "不明") + "）"; return []; }
  const safe = query.replace(/[\%_]/g, m=>"\\"+m);   // ilike の特殊文字をエスケープ
  const { data, error } = await sb.from('profiles').select('id,nickname').ilike('nickname', `%${safe}%`).neq('id', myUserId).limit(20);
  if(error){
    console.error("search failed", error);
    state.friendSearchError = "検索に失敗したよ: " + (error.message || error.code || "unknown");
    return [];
  }
  const friendIds = new Set((state.friends||[]).map(f=>f.id));
  return (data||[]).filter(r=>!friendIds.has(r.id));
}

function mapServerPost(p){
  const reactions = p.post_reactions || [];
  const likes = reactions.filter(r=>r.type==='like');
  const cheers = reactions.filter(r=>r.type==='cheer');
  return {
    id:p.id, name: p.user_id===myUserId ? (myNickname||"あなた") : (p.profiles ? p.profiles.nickname : "?"),
    gender: p.profiles ? p.profiles.gender : state.avatarCustom.gender,
    isMine: p.user_id===myUserId,
    date:p.date, achievement:p.achievement, plannedCount:p.planned_count, doneCount:p.done_count,
    aiComment:p.ai_comment, hitokoto:p.hitokoto, kizuki:p.kizuki, streak:p.streak, visibility:p.visibility,
    likes: likes.length, cheers: cheers.length,
    likedByMe: likes.some(r=>r.user_id===myUserId), cheeredByMe: cheers.some(r=>r.user_id===myUserId),
    comments: (p.post_comments||[]).map(c=>({ author: c.user_id===myUserId ? (myNickname||"あなた") : (c.profiles?c.profiles.nickname:"?"), text:c.text })),
  };
}

async function refreshFriendsAndPosts(){
  if(!myUserId) return;
  const { data: rels } = await sb.from('friendships').select('*').eq('status','accepted')
    .or(`requester_id.eq.${myUserId},addressee_id.eq.${myUserId}`);
  const friendIds = (rels||[]).map(r => r.requester_id===myUserId ? r.addressee_id : r.requester_id);

  const { data: incoming } = await sb.from('friendships')
    .select('id, requester_id, profiles:requester_id(nickname)')
    .eq('status','pending').eq('addressee_id', myUserId);
  state.incomingRequests = incoming || [];

  if(friendIds.length){
    const { data: friendProfiles } = await sb.from('profiles').select('*').in('id', friendIds);
    state.friends = (friendProfiles||[]).map(p=>({ id:p.id, name:p.nickname, gender:p.gender||'boy', level:1, streakBucket:"", badge:"", comment:"", cheeredByMe:false, cheerCount:0 }));
  } else {
    state.friends = [];
  }

  const orParts = [`user_id.eq.${myUserId}`, `visibility.eq.public`];
  if(friendIds.length) orParts.push(`and(user_id.in.(${friendIds.join(',')}),visibility.eq.friends)`);
  const { data: posts, error } = await sb.from('journal_posts')
    .select('*, profiles:user_id(nickname,gender), post_reactions(user_id,type), post_comments(id,user_id,text,profiles:user_id(nickname))')
    .or(orParts.join(','))
    .order('date', { ascending:false });
  if(error){ console.error("fetch posts failed", error); return; }
  const mapped = (posts||[]).map(mapServerPost);
  state.friendPosts = mapped.filter(p=>!p.isMine);
  state.journalEntries = mapped.filter(p=>p.isMine);
}

  else if(t==="todo"){ state.tab="plan"; state.planTab="todo"; }

function deriveSettingsFromAnswers(a){
  const s = JSON.parse(JSON.stringify(state.shareSettings));
  if(a.q1==='motivated') s.timelinePref='active';
  else if(a.q1==='depends') s.timelinePref='sometimes';
  else if(a.q1==='avoid') s.timelinePref='never';
  if(a.q2==='together') s.visibility='friends';
  else if(a.q2==='solo') s.visibility='private';
  if(a.q3==='share'){ if(s.visibility==='private') s.visibility='friends'; s.dataUsage='friends'; }
  else if(a.q3==='private'){ s.dataUsage='none'; }
  return s;
}

function itemValue(id){ const it = ITEMS.find(i=>i.id===id); return it ? it.value : null; }
function shadeColor(hex, percent){
  const h = (hex||"#888888").replace("#","");
  const num = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16);
  let r=(num>>16)+percent, g=((num>>8)&0x00FF)+percent, b=(num&0x0000FF)+percent;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}

function fmtTime(h){ return `${String(Math.floor(h)).padStart(2,"0")}:${h%1?"30":"00"}`; }

function nowHourDecimal(){ const n = new Date(); return n.getHours() + n.getMinutes()/60; }

function nextActionBlock(){
  const blocks = todayBlocks().filter(b=>!b.done).sort((a,b)=>a.start-b.start);
  if(blocks.length===0) return null;
  const nowH = nowHourDecimal();
  const overdueList = blocks.filter(b=> nowH >= b.start+b.duration);
  const current = blocks.find(b=> nowH >= b.start && nowH < b.start+b.duration);
  if(current) return {block:current, status:'now', overdue:overdueList.length};
  const upcoming = blocks.find(b=> b.start > nowH);
  if(upcoming) return {block:upcoming, status:'upcoming', overdue:overdueList.length};
  return {block:overdueList[0], status:'overdue', overdue:overdueList.length};
}

function minutesUntil(startHour){
  const diff = Math.round((startHour - nowHourDecimal())*60);
  return diff;
}

function updateNowLine(){
  const el = document.getElementById("nowline");

  timeline.scrollTop = target;

// ==================== AI Chat ====================
function weeklyInsight(){
  const done = state.blocks.filter(b=>b.done);
  let base;
  if(done.length===0){
    base = "まだ学習記録が少ないので、続けていくと傾向が見えてくるよ。";
  } else {
    const morning = done.filter(b=>b.start<12).length;
    const afternoon = done.filter(b=>b.start>=12&&b.start<18).length;
    const evening = done.filter(b=>b.start>=18).length;
    const max = Math.max(morning,afternoon,evening);
    let timeText = "";
    if(max===morning && morning>0) timeText = "朝の時間帯に集中できているみたい。";
    else if(max===evening && evening>0) timeText = "夜の時間帯によく取り組めているね。";
    else if(max===afternoon && afternoon>0) timeText = "午後の時間帯が続けやすいようだね。";
    const bySubject = {};
    done.forEach(b=>{ bySubject[b.subject]=(bySubject[b.subject]||0)+1; });
    const top = Object.entries(bySubject).sort((a,b)=>b[1]-a[1])[0];
    const subjText = top ? `${top[0]}の完了が多いよ。` : "";
    base = (timeText+subjText) || "少しずつ記録が増えてきたね。";
  }
  if(state.reflections && state.reflections.length>=2){
    const counts = {good:0, ok:0, hard:0};
    state.reflections.forEach(r=>{ counts[r.mood] = (counts[r.mood]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
    const moodText = {
      good: "「集中できた」という記録が多いね、今のやり方が合ってるのかも。",
      ok: "「まあまあ」が多いから、今のペースはちょうど無理のない範囲かもね。",
      hard: "「大変だった」と感じることが多いみたい。時間を短くするか、休憩を増やしてもいいかも。",
    }[top];
    base += " " + moodText;
  }
  return base;
}

function quickReplyOptions(){
  const step = state.aiLocalStep;
  if(step==='availability') return ["18:00-20:00","19:00-21:00","20:00-22:00","21:00-23:00"];
  if(step==='maxDaily') return ["30分","60分","90分","120分"];
  if(step==='daysUntil') return ["3日","7日","14日"];
  if(step==='subjectHours') return ["30分","1時間","2時間","3時間"];
  return null;
}

// ⑥ 期限の表示ヘルパー（保存形式: "YYYY-MM-DD" / "M/D" / "-"）
function parseDeadline(str){
  if(!str || str==="-") return null;
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = /^(\d{1,2})\/(\d{1,2})$/.exec(str);
  if(m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}
function deadlineInfo(t){
  const d = parseDeadline(t.deadline);
  if(!d) return {label: (t.deadline && t.deadline!=="-") ? `${t.deadline}まで` : "期限なし", badge:"", badgeStyle:"", accent:""};
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((d - today)/86400000);
  const label = `${d.getMonth()+1}/${d.getDate()}まで`;
  if(t.done) return {label, badge:"", badgeStyle:"", accent:""};
  if(diff<0) return {label, badge:"期限切れ", badgeStyle:"background:var(--danger);color:#fff;", accent:"var(--danger)"};
  if(diff===0) return {label, badge:"今日まで", badgeStyle:"background:var(--danger);color:#fff;", accent:"var(--danger)"};
  if(diff===1) return {label, badge:"明日", badgeStyle:"background:var(--accent);color:#fff;", accent:"var(--accent)"};
  if(diff<=3) return {label, badge:`あと${diff}日`, badgeStyle:"background:var(--accent);color:#fff;", accent:"var(--accent)"};
  if(diff<=7) return {label, badge:`あと${diff}日`, badgeStyle:"background:var(--primarySoft);color:var(--primary);", accent:""};
  return {label, badge:"", badgeStyle:"", accent:""};
}
function todoDeadlineHTML(t){
  const i = deadlineInfo(t);
  const strong = i.accent ? `color:${i.accent};font-weight:800;` : "";
  const badge = i.badge ? `<span style="${i.badgeStyle}font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;">${i.badge}</span>` : "";
  return `<span style="${strong}">${i.label}</span>${badge}`;
}

function renderTodo(){
  const impLabel = {high:"重要", med:"普通", low:"低"};
  const impColor = {high:"var(--danger)", med:"var(--primary)", low:"var(--textSub)"};
  const dl = t=>{ const d = parseDeadline(t.deadline); return d ? d.getTime() : Infinity; };
  const order={high:0,med:1,low:2};
  const sorted = [...state.tasks].sort((a,b)=>{
    if(!!a.done!==!!b.done) return a.done?1:-1;
    if(state.todoSort==="deadline"){ const x=dl(a), y=dl(b); return x===y ? order[a.importance]-order[b.importance] : (x<y?-1:1); }
    const o = order[a.importance]-order[b.importance]; return o!==0 ? o : (dl(a)<dl(b)?-1:(dl(a)>dl(b)?1:0));
  });
  const listHTML = sorted.length===0
    ? `<div style="font-size:13px;color:var(--textSub);text-align:center;padding:20px;">タスクはありません</div>`
    : sorted.map(t=>`
      <div style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);${deadlineInfo(t).accent?`border-left:4px solid ${deadlineInfo(t).accent};`:''}border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);">
        <input type="checkbox" data-action="toggle-todo" data-id="${t.id}" ${t.done?'checked':''} style="width:18px;height:18px;"/>
        <div style="flex:1;">
          <div style="font-size:13.5px;font-weight:700;${t.done?'text-decoration:line-through;opacity:.5;':''}">${escapeHTML(t.title)}</div>
          <div style="font-size:11px;color:var(--textSub);margin-top:2px;display:flex;gap:6px;align-items:center;">
            ${todoDeadlineHTML(t)}<span style="margin-left:auto;color:${impColor[t.importance]};font-weight:800;">${impLabel[t.importance]}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
          <button class="btn" data-action="edit-todo" data-id="${t.id}" style="padding:4px 8px;font-size:11px;">編集</button>
          <button class="btn soft" data-action="todo-to-schedule" data-id="${t.id}" style="padding:4px 8px;font-size:11px;">予定に入れる</button>
          <button class="btn" data-action="delete-todo" data-id="${t.id}" style="padding:4px 8px;font-size:11px;color:var(--danger);">削除</button>
        </div>
      </div>`).join("");

  return `
  <div style="padding:18px;padding-bottom:90px;">
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      ${[["deadline","締切順"],["importance","重要度順"]].map(([v,l])=>`
        <button class="btn ${state.todoSort===v?'primary':''}" data-action="set-sort" data-val="${v}" style="flex:1;">${l}</button>`).join("")}
    </div>
    <button class="btn primary" data-action="open-todo-add" style="width:100%;margin-bottom:12px;">＋ ToDoを追加</button>
    <div class="todo-list">${listHTML}</div>
  </div>`;
}

function fmtDateLabel(dISO){
  const d = new Date(dISO+"T00:00:00");
  const days = ["日","月","火","水","木","金","土"];
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}

function generateJournalDraft(){
  const todays = todayBlocks();
  const planned = todays.length;
  const doneItems = todays.filter(b=>b.done);
  const done = doneItems.length;
  const achievement = planned>0 ? Math.round(done/planned*100) : 0;

  const yISO = isoDate(dateAdd(new Date(), -1));
  const yesterday = state.journalEntries.find(e=>e.date===yISO);
  let comparisonText = "";
  if(yesterday){
    const diff = achievement - yesterday.achievement;
    if(diff>0) comparisonText = `昨日より${diff}ポイント高い達成率です。`;
    else if(diff<0) comparisonText = `昨日より${Math.abs(diff)}ポイント低めでしたが、記録は続けられています。`;
    else comparisonText = "昨日と同じ達成率をキープしています。";
  }

  const wd = new Date().getDay();
  const wdLabel = ["日","月","火","水","木","金","土"][wd];
  const sameWd = state.journalEntries.filter(e=> new Date(e.date+"T00:00:00").getDay()===wd);
  let patternText = "";
  if(sameWd.length>=2){
    const avgPlanned = sameWd.reduce((s,e)=>s+e.plannedCount,0)/sameWd.length;
    if(avgPlanned>=3) patternText = `${wdLabel}曜日は予定を詰め込みがちな傾向があるみたい。`;
  }

  let parts = [];
  if(planned===0) parts.push("今日は予定がなかったから、無理せず過ごせたね。");
  else if(achievement>=100) parts.push("予定していたことを全部やりきりました。");
  else if(achievement>=50) parts.push("予定の半分以上を進められました。");
  else parts.push("予定より少し少なめでしたが、記録を続けられています。");
  if(comparisonText) parts.push(comparisonText);
  if(patternText) parts.push(patternText);

  state.journalDraft = {
    date: todayISO(), achievement, plannedCount: planned, doneCount: done,
    completedItems: doneItems.map(b=>({title:b.title, subject:b.subject, duration:b.duration})),
    aiComment: parts.join(""),
    hitokoto:"", kizuki:"",
  };
  state.journalVisibility = 'private';
}

  if(all.length===0) return `<div style="font-size:13px;color:var(--textSub);text-align:center;padding:30px 0;">まだ共有された記録はありません。</div>`;
  return `<div style="display:flex;flex-direction:column;gap:14px;">${all.map(p=>renderJournalCard(p)).join("")}</div>`;
}

function attachDynamicListeners(){
  const aiInput = document.getElementById("aiInput");
  if(aiInput){ aiInput.addEventListener("keydown", e=>{ if(e.key==="Enter") aiSend(); }); }
  const scroll = document.getElementById("aiScroll");
  if(scroll) scroll.scrollTop = scroll.scrollHeight;

  const timeline = document.getElementById("timeline");
  if(timeline){
    timeline.scrollTop = state.scheduleScrollTop;
    if(_scheduleAutoScroll){ _scheduleAutoScroll = false; scrollScheduleToNow(timeline); }
    timeline.addEventListener("scroll", ()=>{ state.scheduleScrollTop = timeline.scrollTop; });

    timeline.querySelectorAll("[data-block-id]").forEach(el=>{
      el.addEventListener("pointerdown", (e)=>{
        if(e.target.closest(".resizehandle")) return;
        startBlockDrag(e, el.getAttribute("data-block-id"));
      });
    });
    // resize handles
    timeline.querySelectorAll("[data-resize-id]").forEach(handle=>{
      handle.addEventListener("click", e=>e.stopPropagation());
      handle.addEventListener("pointerdown", (e)=>{
        e.stopPropagation(); e.preventDefault();
        const id = handle.getAttribute("data-resize-id");
        const blockEl = handle.closest(".block");
        const b = state.blocks.find(x=>x.id===id);
        if(!b) return;
        const startY = e.clientY;
        const startScrollTop = timeline.scrollTop;
        const startDuration = b.duration;
        let lastY = e.clientY;
        const applySize = ()=>{
          const deltaH = ((lastY-startY) + (timeline.scrollTop-startScrollTop)) / ROW_H;
          const newDur = Math.max(0.25, Math.min(4, Math.round((startDuration+deltaH)*4)/4));
          b.duration = newDur;
          blockEl.style.height = (newDur*ROW_H-4)+"px";
          const timeEl = blockEl.querySelector(".block-time");
          if(timeEl) timeEl.textContent = `${fmtTime(b.start)} (${newDur*60}分)`;
        };
        const scrollInterval = setInterval(()=>{ edgeAutoScroll(lastY, timeline); applySize(); }, 25);
        const onMove = (ev)=>{ lastY = ev.clientY; applySize(); };
        const onUp = ()=>{
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          clearInterval(scrollInterval);
          render();
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
      });
    });
  }
  document.querySelectorAll("[data-subject-chip]").forEach(el=>{
    el.addEventListener("pointerdown", (e)=> startSubjectDrag(e, el.getAttribute("data-subject-chip")));
  });
}

function edgeAutoScroll(clientY, timeline){
  const rect = timeline.getBoundingClientRect();
  const margin = 60;
  if(clientY > rect.bottom-margin && clientY < rect.bottom+140) timeline.scrollTop += 16;
  else if(clientY < rect.top+margin && clientY > rect.top-140) timeline.scrollTop -= 16;
}

function startBlockDrag(e, blockId){
  e.preventDefault();
  const timeline = document.getElementById("timeline");
  if(!timeline) return;
  const b = state.blocks.find(x=>x.id===blockId);
  if(!b) return;
  const blockEl = timeline.querySelector(`[data-block-id="${blockId}"]`);
  const startX = e.clientX, startY = e.clientY;
  let moved = false;
  let lastX = e.clientX, lastY = e.clientY;

  const applyPosition = ()=>{
    if(!moved) return;
    const h = hourFromY(lastY, timeline);
    b.start = h;
    if(blockEl){
      blockEl.style.top = (h*ROW_H+2)+"px";
      const timeEl = blockEl.querySelector(".block-time");
      if(timeEl) timeEl.textContent = `${fmtTime(h)} (${b.duration*60}分)`;
    }
  };
  const tick = ()=>{ edgeAutoScroll(lastY, timeline); applyPosition(); };
  const scrollInterval = setInterval(tick, 25);

  const onMove = (ev)=>{
    lastX = ev.clientX; lastY = ev.clientY;
    if(!moved && (Math.abs(lastX-startX)>6 || Math.abs(lastY-startY)>6)) moved = true;
    applyPosition();
  };
  const onUp = ()=>{
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    clearInterval(scrollInterval);
    if(!moved){ state.editBlockId = blockId; state.editForm = null; }
    render();
  };
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

function startSubjectDrag(e, subject){
  e.preventDefault();
  const ghost = document.createElement("div");
  ghost.textContent = `${SUBJECT_ICON[subject]||""} ${subject}`;
  ghost.style.cssText = `position:fixed;z-index:200;pointer-events:none;padding:8px 15px;border-radius:999px;color:#fff;font-size:12.5px;font-weight:700;background:${SUBJECT_COLORS[subject]};box-shadow:0 6px 16px rgba(0,0,0,.28);transform:translate(-50%,-120%);left:${e.clientX}px;top:${e.clientY}px;`;
  document.body.appendChild(ghost);
  let lastY = e.clientY, lastX = e.clientX;

  const scrollInterval = setInterval(()=>{
    const timeline = document.getElementById("timeline");
    if(timeline){
      const rect = timeline.getBoundingClientRect();
      if(lastX>=rect.left && lastX<=rect.right) edgeAutoScroll(lastY, timeline);
    }
  }, 25);

  const onMove = (ev)=>{
    lastX = ev.clientX; lastY = ev.clientY;
    ghost.style.left = ev.clientX+"px";
    ghost.style.top = ev.clientY+"px";
  };
  const onUp = ()=>{
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    clearInterval(scrollInterval);
    ghost.remove();
    const timeline = document.getElementById("timeline");
    if(timeline){
      const rect = timeline.getBoundingClientRect();
      if(lastX>=rect.left && lastX<=rect.right && lastY>=rect.top && lastY<=rect.bottom){
        const h = hourFromY(lastY, timeline);
        state.blocks.push({id:uid(), title:subject, subject, start:h, duration:1, done:false, memo:"", repeat:"なし", notify:true, date: state.selectedDate});
      }
    }
    render();
  };
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

function hourFromY(clientY, timeline){
  const rect = timeline.getBoundingClientRect();
  const y = clientY - rect.top + timeline.scrollTop;
  return Math.max(0, Math.min(23.5, Math.round((y/ROW_H)*2)/2));
}

function completeBlock(id){
  const b = state.blocks.find(x=>x.id===id);
  if(!b) return;
  const prevLevel = level();
  const prevExp = state.exp;
  const prevBadgeIds = new Set(earnedBadges().map(x=>x.id));
  const prevItemIds = new Set(unlockedItems().map(x=>x.id));
  const nowDone = !b.done;
  if(nowDone){
    state.exp += 15; state.totalMinutes += b.duration*60;
    addAvatarLine(`ミル: 「${b.title}」お疲れさま！+15exp獲得したよ 🌱`);
  } else {
    state.exp = Math.max(0, state.exp-15); state.totalMinutes = Math.max(0, state.totalMinutes-b.duration*60);
  }
  b.done = nowDone;
  const newLevel = level();
  if(nowDone && newLevel>prevLevel){
    addAvatarLine(`ミル: レベル${newLevel}になったよ！見た目も少しずつ育ってきたね 🎉`);
  }
  if(nowDone){
    showCompletionCelebration({
      title:b.title, gained:state.exp-prevExp, prevExp, newExp:state.exp, prevLevel, newLevel,
      newBadges: earnedBadges().filter(x=>!prevBadgeIds.has(x.id)).map(x=>x.title),
      newItems: unlockedItems().filter(x=>!prevItemIds.has(x.id)).map(x=>x.label),
    });
  }
}

function openTimer(blockId){

function timerTick(){
  if(!state.timerBlockId || !state.timerRunning) return;
  state.timerRemainingSec = Math.max(0, state.timerRemainingSec-1);
  const disp = document.getElementById("timerDisplay");
  const bar = document.getElementById("timerBarFill");
  if(disp) disp.textContent = fmtSeconds(state.timerRemainingSec);
  if(bar){
    const b = state.blocks.find(x=>x.id===state.timerBlockId);
    const total = b ? Math.round(b.duration*3600) : 1;
    bar.style.width = (100 - (state.timerRemainingSec/total*100)) + "%";
  }
  if(state.timerRemainingSec<=0) finishTimer(true);
}
function fmtSeconds(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}
function finishTimer(markDone){
  clearInterval(timerIntervalHandle);
  const id = state.timerBlockId;
  state.timerBlockId = null;
  state.timerRunning = false;
  if(id && markDone){
    const b = state.blocks.find(x=>x.id===id);
    if(b && !b.done) completeBlock(id);
    state.reflectFor = id;
  }
  render();
}

// AI提案から登録するToDoは「1件だけ」。期限はユーザーに確認した締切を使う
function buildAiTodo(items){
  const meta = state.aiTodoMeta || {};
  const study = (items||[]).filter(it=>it.subject!=="休憩");
  const subjects = [...new Set(study.map(it=>it.title))];
  const title = (meta.title && String(meta.title).trim())
    || ((subjects.length ? subjects.slice(0,3).join("・") : "学習") + "の勉強");
  let deadline = meta.deadline;
  if(!deadline || !/^\d{4}-\d{2}-\d{2}$/.test(deadline)){
    const dates = study.map(it=>it.date).filter(Boolean).sort();
    deadline = dates.length ? dates[dates.length-1] : "-";
  }
  return {title: title.slice(0,24), deadline};
}

function dateAdd(base, days){ const d = new Date(base); d.setDate(d.getDate()+days); return d; }

function parseTodoJSON(text){
  const m = text.match(/```todo\s*([\s\S]*?)```/);
  if(!m) return null;
  try{
    const o = JSON.parse(m[1]);
    if(!o || typeof o!=="object") return null;
    const deadline = (typeof o.deadline==="string" && /^\d{4}-\d{2}-\d{2}$/.test(o.deadline)) ? o.deadline : null;
    return {title: o.title ? String(o.title).slice(0,24) : null, deadline};
  }catch(e){ return null; }
}

function parsePlanJSON(text){
  const m = text.match(/```plan\s*([\s\S]*?)```/);
  if(!m) return null;
  try{
    const arr = JSON.parse(m[1]);
    if(!Array.isArray(arr) || arr.length===0) return null;
    return arr.map(it=>{
      let dateISO;
      if(typeof it.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(it.date)) dateISO = it.date;
      else dateISO = isoDate(dateAdd(new Date(), Math.max(0, Number(it.day)||0)));
      const title = String(it.title||"学習").slice(0,20);
      return {
        title,
        subject: title==="休憩" ? "休憩" : (SUBJECT_COLORS[title] ? title : "その他"),
        start: Math.max(0, Math.min(23.5, Number(it.start)||19)),
        duration: Math.max(0.25, Math.min(4, Number(it.duration)||1)),
        date: dateISO,
      };
    });
  }catch(e){ return null; }
}

function buildContext(){
  const scheduleSummary = todayBlocks().map(b=>`${b.title}(${fmtTime(b.start)}〜${b.duration*60}分,${b.done?'完了':'未完了'})`).join('、') || 'なし';
  const todoSummary = state.tasks.filter(t=>!t.done).map(t=>`${t.title}(締切${t.deadline})`).join('、') || 'なし';
  return `\n\n【現在の状況(アプリのデータ)】\n今日の日付: ${todayISO()}\nレベル${level()}・経験値${expInLevel()}/100・継続${state.streak}日\n今日の予定: ${scheduleSummary}\n未着手のToDo: ${todoSummary}\n学習傾向メモ: ${weeklyInsight()}\nこれらの情報を踏まえて、既存の予定と重複しないか、詰め込みすぎていないかも意識して会話してください。`;
}

const BASE_SYSTEM = "あなたは高校生の学習計画づくりを手伝う相談相手「ミル」です。計画を代わりに決めず、質問を重ねながら一緒に考えてください。口調は親しみやすく優しく、責めない。\n\n計画を提案する前に、次の情報がまだ揃っていなければ、一度に1つずつ質問して必ず確認してください。すでに会話や【現在の状況】から分かっている情報は聞き直さないこと:\n1. 平日にだいたい何時から何時まで勉強できるか（生活リズム・学校や部活の時間帯を考慮した現実的な範囲）\n2. 1日に無理なく頑張れる最大時間\n3. 締切は何日か（「あと何日」ではなく、何月何日かの日付で聞くこと。例：「締切は何日？」）\n4. 対象の教科（複数あり得る）と、それぞれにどれくらいの合計時間が必要そうか\n\nこれらが揃うまでは絶対に計画(JSON)を提案せず、質問だけを返してください。\n\n揃ったら、行動科学の知見を踏まえて計画を組み立ててください: 1回のセッションは45分程度を目安に区切り、同じ教科ばかり連続させず教科を交互に配置し（インターリーブ学習）、セッションとセッションの間には10分程度の「休憩」も予定として挟んでください。1日に使える時間の上限を超えないよう、必要なら複数日に分散してください。合計の必要時間が締切までの学習可能時間を超える場合は、計画は作りつつも、その旨を文章で正直に伝えてください（優先順位を下げる教科を提案するなど）。\n\n計画が決まったら、返信の最後に必ず次の形式でJSONのコードブロックを付けてください（この形式以外は使わないこと。休憩も配列に含めること）:\n```plan\n[{\"title\":\"数学\",\"start\":19,\"duration\":0.75,\"date\":\"2026-07-22\"},{\"title\":\"休憩\",\"start\":19.75,\"duration\":0.17,\"date\":\"2026-07-22\"},{\"title\":\"英語\",\"start\":19.92,\"duration\":0.75,\"date\":\"2026-07-22\"}]\n```\ndateはYYYY-MM-DD形式、startは0〜23.5の時刻(小数.5は30分)、durationは時間単位です。\n\nさらに、ユーザーに確認した締切（または試験日）をToDo用に、planブロックの直後へ次の形式で必ず1つだけ付けてください:\n```todo\n{\"title\":\"数学・英語のテスト勉強\",\"deadline\":\"2026-07-29\"}\n```\ntitleは20字以内でまとめた1件の名前、deadlineはYYYY-MM-DD形式です。";

function buildApiMessages(){
  // The API requires the message list to start with a "user" message and strictly
  // alternate roles. Our local log keeps a leading assistant greeting and interleaved
  // "ミル:" avatar lines, so we strip those out and collapse any accidental repeats.
  const filtered = state.aiMessages.filter(m=>!m.text.startsWith("ミル:"));
  const firstUserIdx = filtered.findIndex(m=>m.role==="user");
  const trimmed = firstUserIdx>=0 ? filtered.slice(firstUserIdx) : [];
  const out = [];
  trimmed.forEach(m=>{
    if(out.length && out[out.length-1].role===m.role){
      out[out.length-1].content += "\n"+m.text;
    } else {
      out.push({role:m.role, content:m.text});
    }
  });
  return out;
}

async function aiSend(overrideText){
  const inputEl = document.getElementById("aiInput");
  const text = overrideText ?? (inputEl ? inputEl.value : "");
  if(!text.trim() || state.aiLoading) return;
  state.aiMessages.push({role:"user", text});
  if(inputEl) inputEl.value = "";

  if(state.aiLocalStep){
    handleLocalAnswer(text.trim());
    render();
    return;
  }

  state.aiLoading = true;
  render();
  try{
    const headers = {"Content-Type":"application/json"};
    if(state.userApiKey){
      headers["x-api-key"] = state.userApiKey;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers,
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:700,
        system: BASE_SYSTEM + buildContext(),
        messages: buildApiMessages(),
      }),
    });
    let data;
    try{ data = await res.json(); }
    catch(parseErr){ throw new Error("応答を読み取れませんでした"); }
    if(!res.ok || data.type==="error"){
      const msg = (data && data.error && data.error.message) ? data.error.message : `サーバーエラー(${res.status})`;
      throw new Error(msg);
    }
    const t = (data.content||[]).map(b=>b.text||"").join("\n");
    if(!t) throw new Error("空の応答が返ってきました");
    const items = parsePlanJSON(t);
    const todoMeta = parseTodoJSON(t);
    state.aiMessages.push({role:"assistant", text: t.replace(/```plan[\s\S]*?```/,"").replace(/```todo[\s\S]*?```/,"").trim() || t});
    if(items){
      state.aiProposal = items;
      state.aiTodoMeta = todoMeta;
      const perDay = {};
      items.forEach(it=>{ perDay[it.date] = (perDay[it.date]||0) + it.duration*60; });
      const extraToday = (perDay[todayISO()]||0);
      const existingTodayMinutes = todayBlocks().filter(b=>!b.done).reduce((s,b)=>s+b.duration*60,0);
      const worstDay = Math.max(existingTodayMinutes+extraToday, ...Object.entries(perDay).filter(([d])=>d!==todayISO()).map(([,m])=>m), 0);
      state.aiWarning = worstDay > 240 ? "1日の学習時間が長めの日があるかも。詰め込みすぎない範囲か確認してね。" : null;
    }
  }catch(err){
    console.error("AI chat error:", err);
    state.aiMessages.push({role:"assistant", text:"ごめんね、今はうまく繋がらないみたい。ここから先は質問しながら一緒に決めていくね！"});
    startLocalFlow();
  }
  state.aiLoading = false;
  render();
}

  state.aiLocalAnswers = {};
  state.aiMessages.push({role:"assistant", text:"計画を立てる前に、いくつか教えてね。平日はだいたい何時から何時くらいなら勉強できそう？（例:19時から21時）"});

function parseTimeRange(text){
  const m = text.match(/(\d{1,2})(?::(\d{2}))?\s*時?\s*(?:[〜\-~]|から)\s*(\d{1,2})(?::(\d{2}))?\s*時?/);
  if(!m) return null;
  const start = Math.min(23, parseInt(m[1])) + (m[2]?parseInt(m[2])/60:0);
  const end = Math.min(24, parseInt(m[3])) + (m[4]?parseInt(m[4])/60:0);
  if(end<=start) return null;
  return {start, end};
}
function parseMinutesFromText(text){
  const hourMatch = text.match(/(\d+(?:\.\d+)?)\s*時間/);
  if(hourMatch) return Math.round(parseFloat(hourMatch[1])*60);
  const minMatch = text.match(/(\d+)\s*分/);
  if(minMatch) return parseInt(minMatch[1]);
  const plain = text.match(/(\d+(?:\.\d+)?)/);
  if(plain){
    const n = parseFloat(plain[1]);
    return n<=10 ? Math.round(n*60) : Math.round(n); // small number => treat as hours, else minutes
  }
  return null;
}
// 「7/25」「7月25日」「25日」「25」などを締切日として読み取る（過去日なら来年扱い）
function parseDeadlineDateFromText(text){
  const t = text.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const today = new Date(); today.setHours(0,0,0,0);
  let m = t.match(/(\d{4})[\/\-年]\s*(\d{1,2})[\/\-月]\s*(\d{1,2})/);
  let d = null;
  if(m){ d = new Date(+m[1], +m[2]-1, +m[3]); }
  else if((m = t.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/))){
    d = new Date(today.getFullYear(), +m[1]-1, +m[2]);
    if(d < today) d = new Date(today.getFullYear()+1, +m[1]-1, +m[2]);
  } else if((m = t.match(/(\d{1,2})\s*日?/))){
    const day = +m[1];
    if(day>=1 && day<=31){
      d = new Date(today.getFullYear(), today.getMonth(), day);
      if(d < today) d = new Date(today.getFullYear(), today.getMonth()+1, day);
    }
  }
  if(!d || isNaN(d.getTime())) return null;
  return d;
}
function parseDaysFromText(text){
  const m = text.match(/(\d+)/);
  return m ? parseInt(m[1]) : null;
}
function splitSubjectsText(text){
  return text.split(/[,、\s・]+/).map(s=>s.trim()).filter(Boolean)
    .map(s=>Object.keys(SUBJECT_COLORS).find(k=>k!=="休憩" && s.includes(k)) || s.slice(0,10));
}

function generateSmartPlan(){
  const A = state.aiLocalAnswers;
  const windowMin = Math.round((A.availEnd-A.availStart)*60);
  const dailyCap = Math.max(15, Math.min(A.maxDailyMinutes, windowMin));
  const BREAK_MIN = 10, CHUNK_MIN = 45;

  const perSubjectQueues = {};
  A.subjects.forEach(s=>{
    let remaining = Math.round((A.subjectHours[s]||1)*60);
    const q = [];
    while(remaining>0){ const c = Math.min(CHUNK_MIN, remaining); q.push(c); remaining -= c; }
    perSubjectQueues[s] = q;
  });
  // interleave subjects round-robin (spaced repetition beats cramming one subject at a time)
  const sessionQueue = [];
  let more = true;
  while(more){
    more = false;
    A.subjects.forEach(s=>{
      if(perSubjectQueues[s].length){ sessionQueue.push({subject:s, minutes:perSubjectQueues[s].shift()}); more = true; }
    });
  }

  const items = [];
  let dayIndex = 0, minutesUsed = 0, cursor = A.availStart, overflowMin = 0;
  for(let i=0;i<sessionQueue.length;i++){
    const sess = sessionQueue[i];
    if(minutesUsed + sess.minutes > dailyCap){ dayIndex++; minutesUsed = 0; cursor = A.availStart; }
    if(dayIndex >= A.daysUntil){ overflowMin += sess.minutes; continue; }
    const dateISO = isoDate(dateAdd(new Date(), dayIndex));
    items.push({ title: sess.subject, subject: SUBJECT_COLORS[sess.subject] ? sess.subject : "その他", start: cursor, duration: sess.minutes/60, date: dateISO });
    cursor += sess.minutes/60; minutesUsed += sess.minutes;
    const hasNext = i+1<sessionQueue.length;
    if(hasNext && minutesUsed+BREAK_MIN <= dailyCap){
      items.push({ title:"休憩", subject:"休憩", start:cursor, duration:BREAK_MIN/60, date:dateISO });
      cursor += BREAK_MIN/60; minutesUsed += BREAK_MIN;
    }
  }

  if(items.length===0){
    state.aiMessages.push({role:"assistant", text:"ごめん、今の条件だとうまく計画を組めなかった…！1日に使える時間を増やすか、教科や必要時間を減らして、もう一度試してみてくれる？"});
    state.aiLocalStep = null;
    return;
  }

  state.aiProposal = items;
  state.aiTodoMeta = { title: A.subjects.slice(0,3).join("・") + "の勉強", deadline: A.deadlineISO };
  if(overflowMin>0){
    state.aiWarning = `このペースだと約${Math.round(overflowMin/60*10)/10}時間分が期限内に収まらないかも。1日の学習時間を増やすか、優先度の低い教科を減らすことを考えてみてね。`;
  } else if(dailyCap<30){
    state.aiWarning = "1日に使える時間が短めだから、無理せず少しずつ進めよう。";
  } else {
    state.aiWarning = null;
  }
  const daysUsed = new Set(items.filter(it=>it.subject!=="休憩").map(it=>it.date)).size;
  state.aiMessages.push({role:"assistant", text:`計画ができたよ！${fmtTime(A.availStart)}〜のペースで、${daysUsed}日に分けて、教科を交互に・休憩も挟みながら組んでみたよ。内容を確認して登録してね。`});
  state.aiLocalStep = null;
}

function handleLocalAnswer(text){
  const step = state.aiLocalStep;
  const A = state.aiLocalAnswers;
  if(step==='availability'){
    const r = parseTimeRange(text);
    if(r){ A.availStart = r.start; A.availEnd = r.end; }
    else { A.availStart = 19; A.availEnd = 21; state.aiMessages.push({role:"assistant", text:"うまく聞き取れなかったから、19時〜21時と仮定するね。あとで調整もできるよ。"}); }
    state.aiLocalStep = 'maxDaily';
    state.aiMessages.push({role:"assistant", text:"1日に無理なく頑張れる最大の時間はどれくらい？"});
  } else if(step==='maxDaily'){
    const mins = parseMinutesFromText(text);
    A.maxDailyMinutes = Math.max(15, Math.min(300, mins || 60));
    state.aiLocalStep = 'daysUntil';
    state.aiMessages.push({role:"assistant", text:"締切は何日？（例：7/25 や 7月25日）"});
  } else if(step==='daysUntil'){
    const dl = parseDeadlineDateFromText(text);
    if(!dl){ state.aiMessages.push({role:"assistant", text:"日付がうまく読み取れなかった…！「7/25」や「7月25日」みたいに教えてくれる？"}); return; }
    const today0 = new Date(); today0.setHours(0,0,0,0);
    const diffDays = Math.round((dl - today0)/86400000);
    A.deadlineISO = isoDate(dl);
    A.daysUntil = Math.max(1, Math.min(60, diffDays + 1)); // 締切日当日も学習日に含める
    state.aiLocalStep = 'subjects';
    state.aiMessages.push({role:"assistant", text:"対象の教科を教えて（複数あれば「数学,英語」のようにカンマ区切りでOK。下のボタンでも選べるよ）"});
  } else if(step==='subjects'){
    const subs = splitSubjectsText(text);
    if(subs.length===0){ state.aiMessages.push({role:"assistant", text:"うまく聞き取れなかった、もう一度教えてくれる？"}); return; }
    A.subjects = subs;
    proceedToSubjectHours();
  } else if(step==='subjectHours'){
    const mins = parseMinutesFromText(text);
    const subj = A.subjects[A.subjectIndex];
    A.subjectHours[subj] = Math.max(0.5, Math.min(20, (mins || 60)/60));
    A.subjectIndex += 1;
    if(A.subjectIndex < A.subjects.length) askNextSubjectHours();
    else generateSmartPlan();
  }
}

        if(kind<0.4){ entry.likes=1; state.notifications.unshift({id:uid(), text:`${f.name}さんがいいねしました。`, at: todayISO()}); }
        else if(kind<0.8){ entry.cheers=1; state.notifications.unshift({id:uid(), text:`${f.name}さんが応援しました。`, at: todayISO()}); }
        else { entry.comments=[{author:f.name, text:QUICK_COMMENTS[Math.floor(Math.random()*QUICK_COMMENTS.length)]}]; state.notifications.unshift({id:uid(), text:`${f.name}さんがコメントしました。`, at: todayISO()}); }
      }
    }
    state.journalDraft = null;
    render();
  }
  else if(action==="like-post"){
    const p = findPostById(el.getAttribute("data-id"));
    if(p){
      p.likedByMe = !p.likedByMe; p.likes = Math.max(0,(p.likes||0)+(p.likedByMe?1:-1));
      if(sb && myUserId) toggleReactionOnServer(p.id, 'like', p.likedByMe);
    }
    render();
  }
  else if(action==="cheer-post"){
    const p = findPostById(el.getAttribute("data-id"));
    if(p){
      p.cheeredByMe = !p.cheeredByMe; p.cheers = Math.max(0,(p.cheers||0)+(p.cheeredByMe?1:-1));
      if(sb && myUserId) toggleReactionOnServer(p.id, 'cheer', p.cheeredByMe);
    }
    render();
  }
  else if(action==="toggle-comment-composer"){
    const id = el.getAttribute("data-id");
    state.journalCommentOpenId = state.journalCommentOpenId===id ? null : id;
    render();
  }
  else if(action==="send-quick-comment" || action==="send-comment"){
    const id = el.getAttribute("data-id");
    const p = findPostById(id);
    let text = el.getAttribute("data-val");
    if(!text){
      const inputEl = document.getElementById(`commentInput-${id}`);
      text = inputEl ? inputEl.value.trim() : "";
    }
    if(p && text){
      if(sb && myUserId){
        state.journalCommentOpenId = null;
        pushCommentToServer(id, text);
        return;
      }
      p.comments = p.comments || [];
      p.comments.push({author:"あなた", text});
    }
    state.journalCommentOpenId = null;
    render();
  }
  else if(action==="apply-suggestion"){
    const id = el.getAttribute("data-id");
    if(id==='unusedTimeline') state.shareSettings.timelinePref = 'never';
    state.suggestionDismissed[id] = true;
    render();
  }
  else if(action==="dismiss-suggestion"){ state.suggestionDismissed[el.getAttribute("data-id")] = true; render(); }

  else if(action==="set-avatar-tab"){ state.avatarTab = el.getAttribute("data-tab"); render(); }
  else if(action==="set-gender"){ state.avatarCustom.gender = el.getAttribute("data-val"); render(); }
  else if(action==="equip-item"){
    const cat = el.getAttribute("data-cat");
    const id = el.getAttribute("data-id");
    state.avatarCustom[cat] = id || null;
    render();
  }

  else if(action==="open-todo-add"){ state.todoAddOpen = true; render(); }
  else if(action==="close-todo-add" || action==="close-todo-add-bg"){
    if(action==="close-todo-add-bg" && e.target !== el) return;
    state.todoAddOpen = false; state.todoForm = {title:"", deadline:"", importance:"med"}; render();
  }
  else if(action==="add-todo"){
    const title = document.getElementById("todoTitle").value;
    const deadline = document.getElementById("todoDeadline").value;
    if(!title.trim()){ showToast('<div style="font-size:12.5px;">タスク名を入力してね</div>', 2000); return; }
    const editing = state.todoForm.editId && state.tasks.find(x=>x.id===state.todoForm.editId);
    if(editing){ editing.title = title.trim(); editing.deadline = deadline||"-"; editing.importance = state.todoForm.importance; }
    else state.tasks.push({id:uid(), title:title.trim(), deadline: deadline||"-", importance: state.todoForm.importance, done:false});
    state.todoForm = {title:"", deadline:"", importance:"med"};
    state.todoAddOpen = false;
    render();
  }
  else if(action==="set-importance"){ state.todoForm.importance = el.getAttribute("data-val"); render(); }
  else if(action==="set-sort"){ state.todoSort = el.getAttribute("data-val"); render(); }
  else if(action==="edit-todo"){
    const t = state.tasks.find(x=>x.id===el.getAttribute("data-id"));
    if(t){ const d = parseDeadline(t.deadline); state.todoForm = {title:t.title, deadline: d?isoDate(d):"", importance:t.importance||"med", editId:t.id}; state.todoAddOpen = true; render(); }
  }
  else if(action==="todo-to-schedule"){
    const t = state.tasks.find(x=>x.id===el.getAttribute("data-id"));
    if(t){
      const subj = Object.keys(SUBJECT_COLORS).find(k=>t.title.includes(k)) || "数学";
      state.scheduleAddForm = {subject:subj, title:t.title, date: todayISO(), start:19, duration:1, memo:"", taskId:t.id};
      state.scheduleAddOpen = true; render();
    }
  }
  else if(action==="delete-todo"){ if(!confirm("このToDoを削除しますか？")) return; state.tasks = state.tasks.filter(x=>x.id!==el.getAttribute("data-id")); render(); }
  else if(action==="toggle-todo"){
    const t = state.tasks.find(x=>x.id===el.getAttribute("data-id"));
    if(t) t.done = !t.done;
    render();
  }

  else if(action==="ai-send"){ aiSend(); }
  else if(action==="start-quick-plan"){ startLocalFlow(); render(); }
  else if(action==="toggle-subject-select"){
    const v = el.getAttribute("data-val");
    const sel = state.aiLocalAnswers.subjectsSelected || (state.aiLocalAnswers.subjectsSelected = []);
    const idx = sel.indexOf(v);
    if(idx>=0) sel.splice(idx,1); else sel.push(v);
    render();
  }
  else if(action==="confirm-subjects"){
    const sel = state.aiLocalAnswers.subjectsSelected || [];
    if(sel.length===0) return;
    state.aiMessages.push({role:"user", text: sel.join('、')});
    state.aiLocalAnswers.subjects = sel;
    proceedToSubjectHours();
    render();
  }
  else if(action==="quick-reply"){ aiSend(el.getAttribute("data-val")); }
  else if(action==="toggle-addtodo"){ state.aiAddToTodo = !state.aiAddToTodo; render(); }
  else if(action==="adopt-proposal"){
    state.aiProposal.forEach(it=>{
      state.blocks.push({id:uid(), title:it.title, subject: it.subject || (SUBJECT_COLORS[it.title] ? it.title : "その他"), start:it.start, duration:it.duration||1, done:false, memo:"", repeat:"なし", notify:true, date: it.date || todayISO()});
    });
    if(state.aiAddToTodo){
      const td = buildAiTodo(state.aiProposal);
      state.tasks.push({id:uid(), title:td.title, deadline:td.deadline, importance:"med", done:false});
    }
    addAvatarLine("ミル: これで登録したよ！プランナーに追加したから確認してね。");
    state.aiProposal = null; state.aiWarning = null; state.aiTodoMeta = null;
    render();
  }
  else if(action==="discard-proposal"){ state.aiProposal = null; state.aiWarning = null; state.aiTodoMeta = null; render(); }
});

document.addEventListener("input", (e)=>{
  const id = e.target.id, v = e.target.value, f = state.scheduleAddForm;
  if(id==="scheduleAddTitle") f.title = v;
  else if(id==="scheduleAddDate") f.date = v;
  else if(id==="scheduleAddMemo") f.memo = v;
  else if(id==="scheduleAddStart" && v){ const [h,m] = v.split(":").map(Number); f.start = h + (m>=30?0.5:0); }
  else if(id==="todoTitle") state.todoForm.title = v;
  else if(id==="todoDeadline") state.todoForm.deadline = v;
  else if(id==="friendSearchInput") state.friendSearchQuery = v;
});

document.addEventListener("keydown", (e)=>{
  if(e.target && e.target.id==="friendSearchInput" && e.key==="Enter" && !e.isComposing){ e.preventDefault(); doFriendSearch(); }
});

document.addEventListener("change", (e)=>{
  if(e.target.id==="todoTitle") state.todoForm.title = e.target.value;
  if(e.target.id==="todoDeadline") state.todoForm.deadline = e.target.value;
  if(e.target.id==="myCommentInput"){ state.myComment = e.target.value; schedulePersist(); }
  if(e.target.id==="addFriendInput") state.addFriendName = e.target.value;
  if(e.target.id==="friendSearchInput") state.friendSearchQuery = e.target.value;
  if(e.target.id==="journalHitokoto" && state.journalDraft) state.journalDraft.hitokoto = e.target.value;
  if(e.target.id==="journalKizuki" && state.journalDraft) state.journalDraft.kizuki = e.target.value;
});

window.addEventListener("error", (e)=>{
  const app = document.getElementById("app");
  if(app && !document.getElementById("fatalErrorBox")){
    const box = document.createElement("div");
    box.id = "fatalErrorBox";
    box.style.cssText = "position:fixed;inset:0;background:#fff;color:#111;padding:20px;font-family:sans-serif;font-size:13px;overflow-y:auto;z-index:999;line-height:1.6;";
    box.innerHTML = `<b>エラーが発生して表示できませんでした。</b><br/>下のメッセージをそのままコピーして教えてください。<br/><br/><code style="white-space:pre-wrap;">${(e.message||"unknown error")}\n${(e.filename||"")}:${e.lineno||""}</code>`;
    app.appendChild(box);
  }
});

loadPersisted();
</script>
</body>
</html>
